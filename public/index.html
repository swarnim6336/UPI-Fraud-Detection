<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPI Fraud Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #e0e7ff; /* Soft indigo outer background */
            font-family: 'Poppins', sans-serif; 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        
        /* Main Container mimicking the tablet/screen in the reference */
        .main-container {
            background-color: #1e3a8a; /* Darker navy blue */
            border-radius: 2rem;
            width: 100%;
            max-w: 1200px;
            display: flex;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            min-height: 700px;
        }

        /* Left side - Illustration / Results */
        .left-panel {
            flex: 1;
            background-color: #dbeafe; /* Light blue */
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Right side - Form */
        .right-panel {
            flex: 1;
            background-color: #ffffff;
            border-radius: 2rem;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: -10px 0 30px rgba(0,0,0,0.05);
        }

        /* Inputs */
        .input-box { 
            background: #ffffff; 
            color: #333; 
            border: 1px solid #e2e8f0; 
            border-radius: 1rem;
            padding: 0.75rem 1.25rem;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        .input-box:focus { outline: none; border-color: #60a5fa; box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.2); }
        
        /* Button */
        .btn-blue {
            background-color: #3b82f6;
            color: #ffffff;
            border-radius: 1rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .btn-blue:hover { background-color: #2563eb; transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.3); }
        
        /* Typography */
        .text-dark { color: #1e293b; }
        .text-muted { color: #64748b; }
        
        @media (max-width: 768px) {
            .main-container { flex-direction: column; }
            .right-panel { border-radius: 0 0 2rem 2rem; }
        }
    </style>
</head>
<body>
    
    <div class="main-container max-w-6xl w-full">
        
        <!-- LEFT PANEL (Illustration & Results) -->
        <div class="left-panel text-center" id="leftPanel">
            
            <!-- Default Idle View -->
            <div id="idleView" class="w-full">
                <!-- SVG Illustration placeholder (mimicking the 3D guy) -->
                <img src="https://raw.githubusercontent.com/PKief/vscode-material-icon-theme/main/icons/folder-secure.svg" alt="Security" class="w-48 h-48 mx-auto mb-8 drop-shadow-2xl opacity-80" style="filter: hue-rotate(180deg);">
                <h1 class="text-3xl font-bold text-[#1e3a8a] mb-4">Sentinel Engine</h1>
                <p class="text-[#1e40af] font-medium max-w-sm mx-auto">
                    Inject a simulated transaction into the system to analyze behavioral anomalies in real-time.
                </p>
            </div>

            <!-- Results View (Hidden by default) -->
            <div id="resultsView" class="w-full hidden opacity-0 transition-opacity duration-500">
                <div class="bg-white/50 backdrop-blur-md rounded-2xl p-6 shadow-lg border border-white/60 w-full max-w-md mx-auto">
                    <h2 id="statusText" class="text-2xl font-bold mb-1"></h2>
                    <p id="statusSubtext" class="text-sm font-medium mb-6"></p>
                    
                    <div class="relative w-40 h-40 mx-auto mb-4">
                        <canvas id="gaugeChart"></canvas>
                        <div class="absolute inset-0 flex items-center justify-center flex-col mt-6">
                            <span id="scoreText" class="text-4xl font-bold text-[#1e3a8a]"></span>
                        </div>
                    </div>
                    
                    <div class="text-left mt-6">
                        <h3 class="text-xs font-bold uppercase tracking-wider text-[#1e40af] mb-2">Threat Intelligence</h3>
                        <div id="reasonsList" class="space-y-2 text-sm text-[#1e3a8a] font-medium"></div>
                    </div>
                </div>
            </div>
            
        </div>

        <!-- RIGHT PANEL (Form) -->
        <div class="right-panel">
            <div class="flex items-center gap-2 mb-8 justify-center">
                <svg class="w-6 h-6 text-[#3b82f6]" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M2.166 4.999A11.954 11.954 0 0010 1.944 11.954 11.954 0 0017.834 5c.11.65.166 1.32.166 2.001 0 5.225-3.34 9.67-8 11.317C5.34 16.67 2 12.225 2 7c0-.682.057-1.35.166-2.001zm11.541 3.708a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>
                <span class="font-bold text-xl text-dark">Sentinel<span class="text-muted font-normal">.ai</span></span>
            </div>

            <div class="text-center mb-8">
                <h2 class="text-3xl font-bold text-dark mb-2">Simulate Transaction</h2>
                <p class="text-muted text-sm">Enter payment details to test the ML engine.</p>
            </div>

            <form id="fraudForm" class="space-y-4 max-w-sm mx-auto w-full">
                
                <div class="space-y-1">
                    <label class="text-xs font-semibold text-muted ml-1">User Profile</label>
                    <select id="user_id" class="w-full input-box">
                        <option value="user_1">USER-001 (High Volume)</option>
                        <option value="user_42">USER-042 (New Account)</option>
                        <option value="user_99">USER-099 (Standard)</option>
                    </select>
                </div>

                <div class="space-y-1">
                    <label class="text-xs font-semibold text-muted ml-1">Amount (₹)</label>
                    <input type="number" id="amount" value="1500" class="w-full input-box">
                </div>

                <div class="space-y-1">
                    <label class="text-xs font-semibold text-muted ml-1">Merchant Category</label>
                    <select id="category" class="w-full input-box">
                        <option value="Grocery">Grocery</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Transfer">Transfer</option>
                    </select>
                </div>

                <div class="space-y-1">
                    <label class="text-xs font-semibold text-muted ml-1">Location Data</label>
                    <input type="text" id="location" value="Mumbai" class="w-full input-box">
                </div>

                <div class="space-y-1">
                    <label class="text-xs font-semibold text-muted ml-1">Device Fingerprint</label>
                    <div class="flex gap-2">
                        <input type="text" id="device" value="dev_x99" class="w-full input-box font-mono text-sm">
                        <button type="button" onclick="document.getElementById('device').value='dev_'+Math.random().toString(36).substring(7)" class="bg-blue-50 hover:bg-blue-100 text-blue-600 px-3 rounded-xl text-xs font-semibold transition-colors">NEW</button>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="w-full btn-blue py-3 mt-4 text-sm">
                    Analyze Transaction
                </button>
            </form>
        </div>
    </div>

    <script>
        let gaugeChart = null;

        document.getElementById('fraudForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const originalText = btn.innerText;
            btn.innerText = 'Analyzing...';
            btn.disabled = true;
            
            const payload = {
                user_id: document.getElementById('user_id').value,
                amount: parseFloat(document.getElementById('amount').value),
                merchant_category: document.getElementById('category').value,
                location: document.getElementById('location').value,
                device_id: document.getElementById('device').value
            };

            try {
                const apiUrl = window.location.hostname === 'localhost' ? 'http://127.0.0.1:8000/api/predict' : '/api/predict';
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                displayResults(data);
                
            } catch (err) {
                alert('Connection Error: Is the API running?');
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        });

        function displayResults(data) {
            // Swap views
            document.getElementById('idleView').classList.add('hidden');
            const resultsView = document.getElementById('resultsView');
            resultsView.classList.remove('hidden');
            
            setTimeout(() => { resultsView.classList.remove('opacity-0'); }, 50);

            const statusText = document.getElementById('statusText');
            const statusSubtext = document.getElementById('statusSubtext');
            const leftPanel = document.getElementById('leftPanel');
            
            let color = '#2b533b'; // dark green
            let chartColor = '#4ade80'; // green
            let bgColor = '#c0ebc0'; // light mint
            
            if (data.status === 'CRITICAL') {
                color = '#7f1d1d'; // dark red
                chartColor = '#ef4444'; // red
                bgColor = '#fecaca'; // light red
                statusText.innerText = 'Blocked';
                statusSubtext.innerText = 'High probability of fraud detected.';
            } else if (data.status === 'WARNING') {
                color = '#78350f'; // dark amber
                chartColor = '#f59e0b'; // amber
                bgColor = '#fde68a'; // light amber
                statusText.innerText = 'Auth Required';
                statusSubtext.innerText = 'Anomalous behavior detected.';
            } else {
                statusText.innerText = 'Approved';
                statusSubtext.innerText = 'Behavior matches established baseline.';
            }
            
            leftPanel.style.backgroundColor = bgColor;
            statusText.style.color = color;
            statusSubtext.style.color = color;

            // Update Gauge
            document.getElementById('scoreText').innerText = data.score;
            document.getElementById('scoreText').style.color = color;
            
            if(gaugeChart) gaugeChart.destroy();
            const ctx = document.getElementById('gaugeChart').getContext('2d');
            gaugeChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    datasets: [{
                        data: [data.score, 100 - data.score],
                        backgroundColor: [chartColor, 'rgba(0,0,0,0.1)'],
                        borderWidth: 0,
                        borderRadius: [5, 0],
                        circumference: 240,
                        rotation: 240
                    }]
                },
                options: {
                    cutout: '80%',
                    plugins: { tooltip: { enabled: false } },
                    animation: { animateRotate: true, animateScale: false, duration: 1000 }
                }
            });

            // Update Reasons
            const list = document.getElementById('reasonsList');
            list.innerHTML = '';
            data.reasons.forEach(r => {
                const div = document.createElement('div');
                div.className = 'flex items-start gap-2 bg-white/50 p-2 rounded-lg';
                div.innerHTML = `<span class="mt-0.5">•</span> <span>${r}</span>`;
                list.appendChild(div);
            });
        }
    </script>
</body>
</html>
